<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Quiz</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
</head>

<body class="bg-light">

  <div class="container py-4" style="max-width: 480px;">

    <a href="index.html" class="btn btn-link px-0">&larr; Back</a>

    <h2>Quiz</h2>

    <p class="text-secondary">Choose the correct answer</p>

    <div class="mb-3">
      <label class="form-label">1) 2 + 2=?</label>

      <select id="q1" class="form-select">
        <option value="">Choose</option>
        <option value="3">3</option>
        <option value="4">4</option>
        <option value="5">5</option>
      </select>
    </div>

    <div class="mb-3">
      <label class="form-label">2) Python file ends with?</label>

      <select id="q2" class="form-select">
        <option value="">Choose</option>
        <option value="Riyadh">.py</option>
        <option value="Jeddah">txt</option>
        <option value="Dammam">.html</option>
      </select>
    </div>

    <div class="mb-3">
      <label class="form-label">3) 10 / 2 =?</label>

      <select id="q3" class="form-select">
        <option value="">Choose</option>
        <option value="8">8</option>
        <option value="10">5</option>
        <option value="12">12</option>
      </select>
    </div>

    <button id="btn" class="btn btn-primary">Check Score</button>

    <div id="out" class="alert alert-info mt-3 d-none"></div>

  </div>

  <script>
    document.getElementById("btn").addEventListener("click", function () {

      var q1 = document.getElementById("q1").value;
      var q2 = document.getElementById("q2").value;
      var q3 = document.getElementById("q3").value;

      var score = 0;

      if (q1 == "4")
        score = score + 1;

      if (q2 == "Riyadh")
        score = score + 1;

      if (q3 == "10")
        score = score + 1;

      var out = document.getElementById("out");

      out.classList.remove("d-none");

if (score == 3) { out.textContent = "Your score: " + score + "/3 — Excellent"; } 
else if (score == 2) { out.textContent = "Your score: " + score + "/3 — Good"; } 
else if (score == 1) { out.textContent = "Your score: " + score + "/3 — try again"; } 
else { out.textContent = "Your score: " + score + "/3 — not passed"; }
    });
  </script>

</body>
</html>
